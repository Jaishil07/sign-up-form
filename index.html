<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background">
        <div class="heading">
            <h2>MistBorn</h2>
        </div>
        <div class="credit">
            <p>
                Photo by <a
                    href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Halie
                    West</a> on <a href="https://unsplash.com/">Unsplash</a>
            </p>
        </div>
    </div>
    <main>
        <section class="top">
            <p>This is not a real online service! You know you need something like this in your life to help you realize
                your deepest dreams. Sign up <em>now</em> to get started.</p>
            <p>You <em>know</em> you want to</p>
        </section>
        <section class="form">
            <form id="sign-up">
                <h2>Let's do this!</h2>

                <div class="form-row">
                    <div class="form-element">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" name="fname">
                    </div>

                    <div class="form-element">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" name="lname">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-element">
                        <label for="mail">Email</label>
                        <input type="email" id="mail" name="email">
                    </div>

                    <div class="form-element">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-element">
                        <label for="pswd">First Name</label>
                        <input type="password" id="pswd">
                    </div>

                    <div class="form-element">
                        <label for="cpswd">Last Name</label>
                        <input type="text" id="cpswd">
                    </div>
                </div>
            </form>
        </section>
        <section class="bottom">
            <div class="create-account">
                <button type="submit" form="sign-up">Create Account</button>
            </div>

            <div class="log-in">
                <p>Already have an account? <a href="">Log In</a></p>
            </div>
        </section>
    </main>
</body>

</html>
